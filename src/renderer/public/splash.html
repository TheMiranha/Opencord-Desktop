<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #2b2d31; 
      color: #dbdee1; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      height: 100vh; 
      margin: 0; 
      user-select: none; 
      -webkit-app-region: drag; /* Permite arrastar a janela */
      overflow: hidden;
      border-radius: 8px;
    }
    .icon { 
      width: 80px; height: 80px; 
      background-color: #5865F2; 
      border-radius: 20px; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 40px; color: white; font-weight: bold; 
      margin-bottom: 30px; 
    }
    .bar { 
      width: 200px; height: 4px; 
      background-color: #1e1f22; 
      border-radius: 2px; 
      overflow: hidden; 
      margin-bottom: 10px; 
    }
    .progress { 
      width: 0%; height: 100%; 
      background-color: #5865F2; 
      transition: width 0.2s ease-out; 
    }
    .status { 
      font-size: 12px; font-weight: 600; 
      text-transform: uppercase; letter-spacing: 0.5px; 
    }
  </style>
</head>
<body>
  <!-- Ícone central do Opencord -->
  <div class="icon">O</div>
  
  <!-- Barra de progresso -->
  <div class="bar"><div class="progress" id="progress"></div></div>
  
  <!-- Texto de Status -->
  <div class="status" id="status">Iniciando...</div>

  <script>
    // Escuta os eventos enviados pelo processo principal (Node.js)
    const { ipcRenderer } = require('electron')
    
    ipcRenderer.on('updater-message', (event, text) => {
      document.getElementById('status').innerText = text
    })
    
    ipcRenderer.on('updater-progress', (event, percent) => {
      document.getElementById('progress').style.width = percent + '%'
    })
  </script>
</body>
</html>
